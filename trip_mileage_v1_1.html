<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>出差行車紀錄 V1</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#24332d;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:20px 15px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:0 0 16px}.muted{color:#697a70;font-size:13px}.panel{background:#fff;border:1px solid #dfe7df;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 3px 10px #153c2110}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}label{font-size:13px;font-weight:650}input,textarea,select{font:inherit;border:1px solid #c9d5cb;border-radius:9px;padding:11px;width:100%;background:white;color:#24332d}textarea{min-height:70px;resize:vertical}button,.btn{font:inherit;border:0;border-radius:9px;background:#245e45;color:#fff;padding:11px 15px;cursor:pointer;font-weight:650}button.secondary{background:#e8efe9;color:#245e45}button.danger{background:#fce9e6;color:#a32e25}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.pill{display:inline-block;background:#eaf1ea;color:#296145;padding:5px 9px;border-radius:20px;font-size:12px}.loc{background:#f5f8f5;border:1px solid #e2ebe2;border-radius:10px;padding:12px;margin-top:8px;line-height:1.6;font-size:13px}.summary{font-size:26px;font-weight:750;color:#235c44}.record{border-top:1px solid #e5eae5;padding:13px 0}.record:first-child{border-top:0}a{color:#176c9e}.notice{background:#fff8e8;padding:11px;border-radius:9px;font-size:12px;color:#745b28}.hide{display:none}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263d30;color:white;padding:12px 18px;border-radius:9px;display:none;max-width:90%;z-index:5}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:12px}h1{font-size:21px}.panel{padding:15px}}@media print{body{background:#fff}.no-print,button{display:none!important}.panel{box-shadow:none;break-inside:avoid}header{display:none}}</style></head><body><main class="wrap"><header><div><div class="muted">TRAVEL MILEAGE LOG</div><h1>出差行車紀錄 <span class="pill">V1.1</span></h1></div><div class="muted">手機 / 電腦通用</div></header><div class="notice no-print">GPS 定位需要 HTTPS 網站及定位權限。直接開啟本機 HTML 檔案時，部分手機瀏覽器可能無法定位。資料目前只儲存在此瀏覽器，請定期匯出備份。</div><section class="panel no-print"><h2 id="formTitle">新增出差行程</h2><form id="tripForm"><input type="hidden" id="id"><div class="grid"><div class="field"><label for="traveler">出差人 *</label><input id="traveler" required placeholder="請輸入出差人姓名"></div><div class="field"><label for="date">出差日期 *</label><input id="date" type="date" required></div><div class="field"><label for="vehicle">車輛名稱 / 車牌代號</label><input id="vehicle" placeholder="例如：自用汽車"></div><div class="field"><label for="project">計畫名稱</label><input id="project" placeholder="例如：野生動物監測計畫"></div><div class="field"><label for="purpose">出差事由 *</label><input id="purpose" required placeholder="例如：野外採樣"></div></div><div class="grid"><div><div class="field"><label for="startName">出發地名稱 *</label><input id="startName" required placeholder="例如：屏東科技大學"></div><div class="field"><label for="startTime">出發時間</label><input id="startTime" type="datetime-local"></div><div class="field"><label for="startKm">起始里程表 (km) *</label><input id="startKm" type="number" step="0.1" min="0" required></div><button type="button" class="secondary" id="gpsStart">📍 記錄出發 GPS</button><div id="startGPS" class="loc">尚未記錄 GPS</div></div><div><div class="field"><label for="endName">目的地名稱 *</label><input id="endName" required placeholder="例如：墾丁國家公園"></div><div class="field"><label for="endTime">抵達時間</label><input id="endTime" type="datetime-local"></div><div class="field"><label for="endKm">結束里程表 (km) *</label><input id="endKm" type="number" step="0.1" min="0" required></div><button type="button" class="secondary" id="gpsEnd">📍 記錄抵達 GPS</button><div id="endGPS" class="loc">尚未記錄 GPS</div></div></div><div class="field"><label for="notes">備註</label><textarea id="notes" placeholder="停靠地點、工作內容或其他說明"></textarea></div><div>行駛里程：<span class="summary" id="distance">—</span> km</div><div class="actions"><button type="submit">儲存行程</button><button type="button" class="secondary" id="clear">清空 / 新增下一筆</button></div></form></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>歷史行程</h2><span id="total" class="pill">0 筆</span></div><div class="grid no-print"><div class="field"><label for="from">開始日期</label><input id="from" type="date"></div><div class="field"><label for="to">結束日期</label><input id="to" type="date"></div></div><div class="actions no-print"><button id="excel" type="button">匯出 Excel (.xlsx)</button><button id="pdf" type="button" class="secondary">匯出 PDF</button><button id="backup" type="button" class="secondary">備份 JSON</button><label class="btn" style="cursor:pointer;background:#e8efe9;color:#245e45">匯入備份 <input id="restore" type="file" accept="application/json,.json" style="display:none"></label></div><p class="muted">報表匯出依上方日期篩選；PDF 使用瀏覽器列印功能，可選「儲存為 PDF」。</p><div id="records"></div></section><p class="muted">隱私提醒：GPS 座標與行程資料只存在目前裝置的瀏覽器中；地圖連結會將座標交給 Google Maps。更換裝置不會自動同步。</p></main><div id="toast" role="status"></div><script>
const $=id=>document.getElementById(id), KEY='trip_mileage_v1';let points={start:null,end:null};let trips=[];try{trips=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(trips))trips=[]}catch{trips=[]}const today=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};$('date').value=today();const localTime=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};function msg(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function km(){let a=$('startKm').value,b=$('endKm').value;if(a===''||b===''){$('distance').textContent='—';return null}let n=Number(b)-Number(a);$('distance').textContent=n>=0?n.toFixed(1):'無效';return n}['startKm','endKm'].forEach(x=>$(x).addEventListener('input',km));function mapURL(p){return p?`https://www.google.com/maps?q=${encodeURIComponent(p.lat+','+p.lng)}`:''}function gpsLabel(p){return p?`緯度 ${p.lat.toFixed(6)}，經度 ${p.lng.toFixed(6)}<br>精度約 ±${Math.round(p.accuracy)} m　${escapeHTML(p.time)}<br><a href="${mapURL(p)}" target="_blank" rel="noopener">在 Google Maps 查看</a>`:'尚未記錄 GPS'}function updateGPS(){['start','end'].forEach(k=>$(k+'GPS').innerHTML=gpsLabel(points[k]))}function locate(which){if(!navigator.geolocation){msg('此瀏覽器不支援 GPS');return}let b=$(which==='start'?'gpsStart':'gpsEnd');b.disabled=true;b.textContent='定位中…';navigator.geolocation.getCurrentPosition(pos=>{points[which]={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,time:new Date(pos.timestamp).toISOString()};$(which==='start'?'startTime':'endTime').value=localTime();updateGPS();b.disabled=false;b.textContent=which==='start'?'📍 記錄出發 GPS':'📍 記錄抵達 GPS';msg('GPS 位置已取得，請儲存行程')},err=>{b.disabled=false;b.textContent=which==='start'?'📍 記錄出發 GPS':'📍 記錄抵達 GPS';msg('定位失敗：'+err.message+'。請確認 HTTPS、定位權限及手機 GPS。')},{enableHighAccuracy:true,timeout:20000,maximumAge:0})} $('gpsStart').onclick=()=>locate('start');$('gpsEnd').onclick=()=>locate('end');function persist(){try{localStorage.setItem(KEY,JSON.stringify(trips));return true}catch(e){msg('儲存失敗，可能是瀏覽器空間不足');return false}}function reset(){ $('tripForm').reset();$('id').value='';$('date').value=today();points={start:null,end:null};updateGPS();km();$('formTitle').textContent='新增出差行程'}$('clear').onclick=reset;$('tripForm').onsubmit=e=>{e.preventDefault();let distance=km();if(distance===null||distance<0){msg('請確認結束里程不小於起始里程');return}let obj={id:$('id').value||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),date:$('date').value,traveler:$('traveler').value.trim(),vehicle:$('vehicle').value.trim(),project:$('project').value.trim(),purpose:$('purpose').value.trim(),startName:$('startName').value.trim(),endName:$('endName').value.trim(),startTime:$('startTime').value,endTime:$('endTime').value,startKm:Number($('startKm').value),endKm:Number($('endKm').value),distance,notes:$('notes').value.trim(),startGPS:points.start,endGPS:points.end,updatedAt:new Date().toISOString()};let i=trips.findIndex(t=>t.id===obj.id);if(i>=0)trips[i]=obj;else trips.push(obj);if(persist()){reset();render();msg('行程已儲存')}};function filtered(){return trips.filter(t=>(!$('from').value||t.date>=$('from').value)&&(!$('to').value||t.date<=$('to').value)).sort((a,b)=>b.date.localeCompare(a.date))}function render(){let a=filtered(),sum=a.reduce((s,t)=>s+Number(t.distance||0),0);$('total').textContent=`${a.length} 筆｜合計 ${sum.toFixed(1)} km`;$('records').innerHTML=a.length?a.map(t=>`<div class="record"><b>${escapeHTML(t.date)}｜${escapeHTML(t.purpose)}</b><div class="muted">出差人：${escapeHTML(t.traveler||'未填')}</div><div class="muted">${escapeHTML(t.project||'未填計畫')} · ${escapeHTML(t.vehicle||'未填車輛')}</div><p>${escapeHTML(t.startName)} → ${escapeHTML(t.endName)}<br>里程表 ${t.startKm} → ${t.endKm} km，<b>${Number(t.distance).toFixed(1)} km</b></p><div class="muted">出發：${escapeHTML(t.startTime||'未填')}　抵達：${escapeHTML(t.endTime||'未填')}</div>${t.notes?`<p class="muted">${escapeHTML(t.notes)}</p>`:''}<div class="actions no-print">${t.startGPS?`<a href="${mapURL(t.startGPS)}" target="_blank" rel="noopener">出發地圖 ↗</a>`:''}${t.endGPS?`<a href="${mapURL(t.endGPS)}" target="_blank" rel="noopener">抵達地圖 ↗</a>`:''}<button class="secondary" onclick="editTrip('${t.id}')">編輯</button><button class="danger" onclick="deleteTrip('${t.id}')">刪除</button></div><div class="muted">GPS：出發 ${t.startGPS?'已記錄':'未記錄'}；抵達 ${t.endGPS?'已記錄':'未記錄'}</div></div>`).join(''):'<p class="muted">尚無符合條件的行程</p>'}window.editTrip=id=>{let t=trips.find(x=>x.id===id);if(!t)return;['id','date','traveler','vehicle','project','purpose','startName','endName','startTime','endTime','startKm','endKm','notes'].forEach(k=>$(k).value=t[k]??'');points={start:t.startGPS||null,end:t.endGPS||null};updateGPS();km();$('formTitle').textContent='編輯出差行程';window.scrollTo({top:0,behavior:'smooth'})};window.deleteTrip=id=>{if(!confirm('確定刪除此行程？'))return;trips=trips.filter(t=>t.id!==id);persist();render()};$('from').onchange=render;$('to').onchange=render;function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function rows(){return filtered().map(t=>({'日期':t.date,'出差人':t.traveler||'','車輛':t.vehicle,'計畫名稱':t.project,'出差事由':t.purpose,'出發地':t.startName,'目的地':t.endName,'出發時間':t.startTime,'抵達時間':t.endTime,'起始里程(km)':t.startKm,'結束里程(km)':t.endKm,'行駛里程(km)':t.distance,'出發緯度':t.startGPS?.lat??'','出發經度':t.startGPS?.lng??'','抵達緯度':t.endGPS?.lat??'','抵達經度':t.endGPS?.lng??'','出發地圖':mapURL(t.startGPS),'抵達地圖':mapURL(t.endGPS),'備註':t.notes}))}function loadScript(src){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.append(s)})}$('excel').onclick=async()=>{let data=rows();if(!data.length){msg('沒有可匯出的行程');return}try{if(!window.XLSX)await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');let ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();ws['!cols']=Object.keys(data[0]).map(k=>({wch:Math.min(35,Math.max(14,k.length*2))}));XLSX.utils.book_append_sheet(wb,ws,'出差行程');XLSX.writeFile(wb,'出差行車紀錄_'+today()+'.xlsx')}catch(e){msg('Excel 函式庫無法載入，請連線網路後再試。')}};$('pdf').onclick=()=>{if(!filtered().length){msg('沒有可匯出的行程');return}window.print()};$('backup').onclick=()=>download(new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),trips},null,2)],{type:'application/json'}),'出差紀錄備份_'+today()+'.json');$('restore').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.trips)||d.trips.some(t=>!t.id||!t.date||typeof t.distance!=='number'))throw Error('格式不符');if(!confirm(`匯入 ${d.trips.length} 筆紀錄？相同 ID 的資料將被覆蓋。`))return;let m=new Map(trips.map(t=>[t.id,t]));d.trips.forEach(t=>m.set(t.id,t));trips=[...m.values()];persist();render();msg('匯入完成')}catch(err){msg('無法匯入：'+err.message)}e.target.value=''};updateGPS();render();
</script></body></html>
